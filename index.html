<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ATLAS Lab — Centro de Análisis del Partido (alta fidelidad)</title>
<!-- flag-icons (MIT license) — banderas reales, dominio publico + libreria libre, sin descargar/redistribuir marcas de terceros -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icons/7.2.3/css/flag-icons.min.css">
<style>
  :root {
    --ink: #0c0d10; --surface: #17181c; --surface-2: #1e2025; --border: #2a2c32;
    --text: #f0f0f2; --text-dim: #a3a5ac; --text-faint: #6b6d74;
    --green: #4fae63; --green-soft: rgba(79,174,99,0.13);
    --amber: #d9a441; --amber-soft: rgba(217,164,65,0.13);
    --clay: #c97a3d; --clay-soft: rgba(201,122,61,0.13);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Consolas, "Courier New", monospace;
    --serif: Georgia, "Iowan Old Style", "Noto Serif", serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ink: #f2f4ee; --surface: #ffffff; --surface-2: #eaeee4; --border: #d8ddd2;
      --text: #171d19; --text-dim: #4e5951; --text-faint: #838f86;
      --green: #3f7a49; --green-soft: rgba(63,122,73,0.1);
      --amber: #966d1c; --amber-soft: rgba(150,109,28,0.1);
      --clay: #a85d28; --clay-soft: rgba(168,93,40,0.1);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ink); color: var(--text); font-family: var(--sans); line-height: 1.4; -webkit-font-smoothing: antialiased; font-size: 13.5px; }
  a { color: inherit; } button { font: inherit; }
  ::-webkit-scrollbar { display: none; }

  .concept-tag {
    position: fixed; top: 8px; right: 8px; z-index: 80;
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-faint); background: var(--surface); border: 1px solid var(--border);
    padding: 3px 7px; border-radius: 999px;
  }

  /* ---------- home: panel de descubrimiento (estructura tipo dashboard) ---------- */
  #view-list { max-width: 900px; margin: 0 auto; padding: 0 0 40px; }

  .app-header {
    position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; background: color-mix(in srgb, var(--ink) 93%, transparent); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .hamburger-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px;
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; flex-shrink: 0;
  }
  .app-header .wordmark { font-family: var(--serif); font-weight: 700; font-size: 16px; flex-shrink: 0; }
  .app-header .wordmark .dot { color: var(--green); }
  .search-pill {
    flex: 1; display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 12px; color: var(--text-faint); font-size: 11.5px;
  }

  /* drawer lateral */
  .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; }
  .drawer-overlay[hidden] { display: none; }
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 240px; background: var(--surface);
    border-right: 1px solid var(--border); z-index: 91; padding: 16px 14px; overflow-y: auto;
  }
  .drawer h4 { font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); margin: 16px 0 6px; }
  .drawer h4:first-child { margin-top: 0; }
  .drawer-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-radius: 6px; cursor: pointer;
    font-size: 13px; color: var(--text-dim);
  }
  .drawer-item.active { color: var(--green); background: var(--green-soft); font-weight: 600; }
  .drawer-item .ic { width: 16px; text-align: center; opacity: 0.8; }

  .home-body { padding: 14px 14px 0; }
  .section-title {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--text-faint); margin: 22px 0 10px; display: flex; align-items: center; justify-content: space-between;
  }

  /* hero destacado */
  .hero-wrap { position: relative; }
  .hero-card {
    border-radius: 14px; overflow: hidden; position: relative; padding: 20px 18px 16px; min-height: 150px;
    background: radial-gradient(140% 100% at 100% 0%, color-mix(in srgb, var(--green) 12%, var(--surface-2)), var(--surface) 60%);
    border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: flex-end;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  }
  .hero-card .kicker { font-family: var(--mono); font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--green); margin-bottom: 8px; }
  .hero-card .teams { font-size: clamp(19px, 6vw, 24px); font-weight: 800; line-height: 1.25; margin-bottom: 6px; }
  .hero-card .teams .vsx { color: var(--text-faint); font-family: var(--mono); font-size: 11px; font-weight: 400; margin: 0 6px; }
  .hero-card .sub { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
  .hero-actions { display: flex; gap: 8px; }
  .btn-primary { background: var(--green); color: #0a0f0c; border: none; border-radius: 8px; padding: 9px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .btn-ghost { background: color-mix(in srgb, var(--ink) 40%, transparent); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 9px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .hero-dots { display: flex; gap: 4px; justify-content: center; margin-top: 10px; }
  .hero-dots span { width: 5px; height: 5px; border-radius: 999px; background: var(--border); }
  .hero-dots span.active { background: var(--green); width: 14px; }

  /* proximos partidos */
  .upcoming-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; }
  .match-card {
    flex-shrink: 0; width: 180px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; scroll-snap-align: start; box-shadow: 0 3px 10px rgba(0,0,0,0.25);
  }
  .match-card .date-badge { font-family: var(--mono); font-size: 9.5px; color: var(--text-faint); margin-bottom: 8px; }
  .crest-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .crest {
    width: 27px; height: 27px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 9.5px; font-weight: 800; color: #fff; flex-shrink: 0;
    border: 2px solid transparent; text-shadow: 0 1px 1px rgba(0,0,0,0.35);
  }
  .crest.certified { border-color: var(--green); } .crest.progress { border-color: var(--amber); } .crest.none { border-color: var(--border); }
  .vsx-sm { font-family: var(--mono); font-size: 9.5px; color: var(--text-faint); }
  .match-card .team-name { font-size: 12.5px; font-weight: 700; line-height: 1.3; margin-bottom: 2px; }
  .match-card .league-tag { font-size: 10px; color: var(--text-faint); margin-bottom: 6px; }
  .match-card .signal { font-size: 10.5px; color: var(--green); margin-bottom: 10px; line-height: 1.35; min-height: 14px; }
  .match-card-actions { display: flex; gap: 6px; }
  .btn-add { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 7px; width: 30px; height: 30px; flex-shrink: 0; cursor: pointer; font-size: 14px; }
  .btn-analysis { flex: 1; background: var(--green); color: #0a0f0c; border: none; border-radius: 7px; font-size: 11.5px; font-weight: 700; cursor: pointer; }

  /* panel de estadisticas (rail) */
  .stat-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.25); }
  .stat-panel-title { font-size: 12px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
  .stat-entry { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .stat-entry:last-child { border-bottom: none; }
  .stat-entry .name { font-size: 12px; font-weight: 600; }
  .stat-entry .sub { font-size: 10px; color: var(--text-faint); }
  .stat-bar-wrap { width: 70px; height: 4px; background: var(--border); border-radius: 999px; overflow: hidden; margin-top: 4px; }
  .stat-bar { height: 100%; background: var(--green); }

  .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .category-card { border-radius: 10px; padding: 10px 11px; font-size: 11px; font-weight: 700; line-height: 1.35; border: 1px solid var(--border); }
  .category-card .sub { display: block; font-weight: 400; font-size: 10px; margin-top: 3px; opacity: 0.85; }
  .cat-productivo { background: var(--green-soft); color: var(--green); }
  .cat-experimental { background: var(--amber-soft); color: var(--amber); }
  .cat-cerrado { background: var(--surface-2); color: var(--text-faint); }

  /* ---------- Centro de Analisis ---------- */
  #view-center[hidden] { display: none; }
  .center-topbar {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--ink) 95%, transparent); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .center-topbar .row1 { display: flex; align-items: center; gap: 10px; padding: 9px 14px; max-width: 900px; margin: 0 auto; }
  .back-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 999px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; flex-shrink: 0; }
  .center-topbar .match-id { min-width: 0; }
  .center-topbar .league-line { font-family: var(--mono); font-size: 10px; color: var(--text-faint); }
  .center-topbar .teams-line { font-size: 14.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .center-topbar .teams-line .vsx { color: var(--green); font-family: var(--mono); font-size: 10px; font-weight: 400; margin: 0 5px; }

  .quicknav { display: flex; gap: 4px; overflow-x: auto; padding: 0 14px 8px; max-width: 900px; margin: 0 auto; }
  .qn-pill { flex-shrink: 0; font-family: var(--mono); font-size: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); border-radius: 999px; padding: 4px 9px; cursor: pointer; white-space: nowrap; }
  .qn-pill:hover { border-color: color-mix(in srgb, var(--green) 45%, var(--border)); }

  .center-body { max-width: 900px; margin: 0 auto; padding: 14px 14px 80px; }

  .module { border-top: 1px solid var(--border); padding: 16px 0; scroll-margin-top: 96px; }
  .module:first-child { border-top: none; }
  .module-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .module-title-group { display: flex; align-items: baseline; gap: 8px; }
  .module-title { font-size: 14px; font-weight: 700; }
  .source-tag { font-family: var(--mono); font-size: 9px; letter-spacing: 0.03em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
  .source-tag.ce { color: var(--green); border-color: color-mix(in srgb, var(--green) 50%, var(--border)); background: var(--green-soft); }
  .source-tag.pocket { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 50%, var(--border)); background: var(--amber-soft); }
  .source-tag.lab { color: var(--clay); border-color: color-mix(in srgb, var(--clay) 50%, var(--border)); background: var(--clay-soft); }
  .source-tag.none { color: var(--text-faint); border-color: var(--border); }

  .pending-banner {
    display: flex; gap: 8px; align-items: flex-start; background: var(--surface); border: 1px dashed var(--border);
    border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--text-dim); margin-bottom: 10px;
  }
  .pending-banner .ic { flex-shrink: 0; color: var(--text-faint); }

  .data-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--border); }
  .data-row:last-child { border-bottom: none; }
  .data-row .left { min-width: 0; }
  .data-row .metric { font-size: 12.5px; font-weight: 600; }
  .data-row .context { font-size: 11px; color: var(--text-faint); margin-top: 1px; }
  .data-row .right { flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
  .data-row .value { font-family: var(--mono); font-size: 13px; font-weight: 700; }
  .marker-badge.certified { color: var(--green); } .marker-badge.progress { color: var(--amber); }

  .coverage-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .coverage-table td { padding: 6px 4px; border-bottom: 1px solid var(--border); }
  .coverage-table td.status { text-align: right; font-family: var(--mono); font-size: 10px; white-space: nowrap; }
  .st-productivo { color: var(--green); } .st-experimental { color: var(--amber); } .st-cerrado { color: var(--text-faint); } .st-abierta { color: var(--amber); }

  .odds-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .odds-field { flex: 1; }
  .odds-field label { display: block; font-family: var(--mono); font-size: 9.5px; color: var(--text-faint); margin-bottom: 3px; }
  .odds-field input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 7px 8px; font-family: var(--mono); font-size: 13px;
  }
  .odds-field input:focus { outline: none; border-color: var(--green); }

  .finding-banner {
    background: var(--clay-soft); border: 1px solid color-mix(in srgb, var(--clay) 40%, var(--border));
    border-radius: 8px; padding: 10px 12px; font-size: 12px; margin-top: 8px;
  }
  .finding-banner b { color: var(--clay); }

  .gov-legend { display: flex; gap: 10px; flex-wrap: wrap; font-family: var(--mono); font-size: 10px; color: var(--text-faint); margin-bottom: 10px; }
  .gov-legend .active { color: var(--amber); font-weight: 700; }

  .rec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .rec-cell { border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 11px; color: var(--text-faint); }
  .rec-cell.active { border-color: color-mix(in srgb, var(--green) 55%, var(--border)); background: var(--green-soft); color: var(--green); font-weight: 700; }
  .rec-result {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    font-size: 12.5px; text-align: center; color: var(--text-dim);
  }

  .lab-entry { padding: 8px 4px; border-bottom: 1px solid var(--border); }
  .lab-entry:last-child { border-bottom: none; }
  .lab-entry .h { font-size: 12.5px; font-weight: 600; }
  .lab-entry .d { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }

  .footer-note { margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 10.5px; color: var(--text-faint); text-align: center; }

  /* ---------- estilos de filtros y secciones de liga ---------- */
  #view-story[hidden] { display: none; }
  .league-filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; }
  .league-chip {
    flex-shrink: 0; font-size: 11px; font-weight: 600; color: var(--text-dim); background: var(--surface);
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 11px; cursor: pointer; display: flex; align-items: center; gap: 5px;
  }
  .league-chip.active { background: var(--green-soft); border-color: color-mix(in srgb, var(--green) 55%, var(--border)); color: var(--green); }
  .league-section-title {
    font-size: 12.5px; font-weight: 700; margin: 16px 0 8px; display: flex; align-items: center; gap: 6px;
  }
  .see-all-card { background: var(--surface-2); border: 1px dashed var(--border); color: var(--text-dim); }

  /* ---------- vista de detalle de liga (lista completa) ---------- */
  #view-league-detail[hidden] { display: none; }
  .league-detail-body { max-width: 720px; margin: 0 auto; padding: 4px 14px 60px; }
  .league-detail-head { padding: 10px 0 14px; }
  .league-detail-head .title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
  .league-detail-head .count { font-family: var(--mono); font-size: 11px; color: var(--text-faint); margin-top: 3px; }
  .mrow { display: flex; align-items: center; gap: 8px; padding: 9px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .mrow:active { background: var(--surface); }
  .mrow .marker { width: 16px; text-align: center; font-size: 12px; flex-shrink: 0; }
  .mrow .marker.certified { color: var(--green); } .mrow .marker.progress { color: var(--amber); } .mrow .marker.none { color: var(--text-faint); opacity: .35; }
  .mrow .body { flex: 1; min-width: 0; }
  .mrow .meta { font-family: var(--mono); font-size: 10px; color: var(--text-faint); }
  .mrow .teams { font-size: 12.5px; font-weight: 600; margin-top: 2px; }
  .mrow .teams .vsx { color: var(--text-faint); font-weight: 400; font-size: 10.5px; margin: 0 4px; }
  .mrow .go { color: var(--text-faint); font-size: 13px; }
</style>
</head>
<body>

<span class="concept-tag">Alta fidelidad · fuentes reales por módulo</span>

<!-- ============ HOME: panel de descubrimiento ============ -->
<div id="view-list">
  <header class="app-header">
    <button class="hamburger-btn" id="menu-btn">☰</button>
    <div class="wordmark">ATLAS<span class="dot">·</span>LAB</div>
    <div class="search-pill">🔍 Buscar equipo, liga...</div>
  </header>
  <div class="home-body">
    <div class="hero-wrap" id="hero-wrap"></div>
    <div class="section-title"><span>Todas las ligas activas</span></div>
    <div class="league-filter-row" id="league-filter-row"></div>
    <div id="league-sections"></div>
    <div class="section-title"><span>Radiografía de liga — Série B</span></div>
    <div class="stat-panel" id="stat-league"></div>
    <div class="section-title"><span>Cobertura de mercados (motor real)</span></div>
    <div class="category-grid" id="category-grid"></div>
  </div>
</div>

<div class="drawer-overlay" id="drawer-overlay" hidden></div>
<nav class="drawer" id="drawer" hidden>
  <h4>Menú</h4>
  <div class="drawer-item active">🏠 Partidos</div>
  <h4>General</h4>
  <div class="drawer-item" style="opacity:.5">⚙ Configuración (no disponible)</div>
</nav>

<!-- ============ DETALLE DE LIGA (todos los partidos) ============ -->
<div id="view-league-detail" hidden>
  <div class="center-topbar">
    <div class="row1">
      <button class="back-btn" id="league-detail-back-btn">←</button>
      <span class="wordmark" style="font-size:14px">ATLAS·LAB</span>
    </div>
  </div>
  <div class="league-detail-body">
    <div class="league-detail-head">
      <div class="title" id="league-detail-title"></div>
      <div class="count" id="league-detail-count"></div>
    </div>
    <div id="league-detail-list"></div>
  </div>
</div>

<!-- ============ CENTRO DE ANALISIS ============ -->
<div id="view-center" hidden>
  <div class="center-topbar">
    <div class="row1">
      <button class="back-btn" id="back-btn">←</button>
      <div class="match-id">
        <div class="league-line" id="c-league"></div>
        <div class="teams-line" id="c-teams"></div>
      </div>
    </div>
    <div class="quicknav" id="quicknav"></div>
  </div>
  <div class="center-body" id="center-body"></div>
</div>

<script>
/* Datos reales verificados (2026-07-25): coberturas de MOTOR_REGISTRY.md,
   hallazgo K-0007, cierre del programa E00X (Carril B), contrato Estimation
   de Atlas Pocket, y el contenido editorial real ya generado por Content
   Engine. Los modulos que dependen del puente Content Engine <-> Atlas
   Pocket (recien aprobado como arquitectura, no implementado) se muestran
   con su estado real: pendiente de integracion, nunca con un numero
   inventado. */

/* 261 partidos reales verificados en future_fixtures (consultado 2026-07-26)
   en 9 ligas activas. kickoffUTC es la hora real de future_fixtures.kickoff_utc
   (columna verificada, con variedad real de horarios, no un valor de relleno).
   Se muestra convertida a hora de Chile continental (UTC-4 en invierno austral
   -- Chile solo pasa a UTC-3 en horario de verano, septiembre-abril; en julio
   corresponde UTC-4). Muestra amplia de cada liga, no las 261 completas, por
   manejabilidad -- todas las ligas activas quedan representadas y filtrables. */
const CHILE_UTC_OFFSET = -4; // horario estandar de Chile continental (invierno austral, vigente en julio)

const MATCHES = [
  // Brasileirao Serie B

function initials(name) {
  return name.split(" ").filter(w => w.length > 1 || /[A-Za-zÀ-ÿ]/.test(w)).slice(0, 2).map(w => w[0]).join("").toUpperCase();
}

/* Insignia generada por ATLAS -- color derivado deterministicamente del
   nombre del equipo (hash simple -> tono HSL). Nunca reproduce un escudo
   real; es un diseno propio, distinto para cada equipo, estable entre
   renders (mismo equipo = mismo color siempre). */
function teamColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  const hue = hash % 360;
  return `hsl(${hue}, 46%, 34%)`;
}

/* Conversion de kickoffUTC (real, columna future_fixtures.kickoff_utc) a
   hora de Chile continental. TODAY_CHILE es la fecha real de hoy que
   confirmo el Director (2026-07-26). */
const TODAY_CHILE = new Date(2026, 6, 26); // mes 0-indexado: 6 = julio
const MONTHS_ES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

function toChileDate(kickoffUTC) {
  const utcMs = new Date(kickoffUTC).getTime();
  return new Date(utcMs + CHILE_UTC_OFFSET * 3600 * 1000);
}
function chileDateLabel(d) {
  const d0 = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffDays = Math.round((d0 - TODAY_CHILE) / 86400000);
  if (diffDays === 0) return "Hoy";
  if (diffDays === 1) return "Mañana";
  return `${String(d.getDate()).padStart(2, "0")} ${MONTHS_ES[d.getMonth()]}`;
}
function chileTimeLabel(d) {
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function matchWhen(m) {
  const chileDate = toChileDate(m.kickoffUTC);
  return `${chileDateLabel(chileDate)} · ${chileTimeLabel(chileDate)}`;
}

const PREVIEW_PER_LEAGUE = 3;

function sortByKickoff(matches) {
  return matches.slice().sort((a, b) => new Date(a.kickoffUTC) - new Date(b.kickoffUTC));
}

function seeAllTileHtml(league, total) {
  return `
  <div class="match-card see-all-card" data-league="${league}" style="display:flex;align-items:center;justify-content:center;text-align:center;">
    <div>
      <div style="font-size:20px;margin-bottom:4px">→</div>
      <div style="font-size:12px;font-weight:700">Ver todos</div>
      <div style="font-size:10.5px;color:var(--text-faint)">${total} partidos</div>
    </div>
  </div>`;
}

function renderLeagueSections() {
  const pool = MATCHES.filter(m => !m.flagship);
  const leagues = activeLeague === "ALL" ? LEAGUES_ORDERED : [activeLeague];
  document.getElementById("league-sections").innerHTML = leagues.map(lg => {
    const matches = sortByKickoff(pool.filter(m => m.league === lg));
    if (!matches.length) return "";
    const preview = matches.slice(0, PREVIEW_PER_LEAGUE);
    const seeAll = matches.length > PREVIEW_PER_LEAGUE ? seeAllTileHtml(lg, matches.length) : "";
    return `
    <div class="league-section-title" data-league-header="${lg}" style="cursor:pointer">${flagIcon(lg)} ${lg} <span style="color:var(--text-faint);font-weight:400;font-size:10.5px">(${matches.length}) →</span></div>
    <div class="upcoming-scroll">${preview.map(matchCardHtml).join("")}${seeAll}</div>`;
  }).join("");
  document.querySelectorAll(".match-card:not(.see-all-card)").forEach(c => c.addEventListener("click", () => openTile(c.dataset.id)));
  document.querySelectorAll(".see-all-card").forEach(c => c.addEventListener("click", () => openLeagueDetail(c.dataset.league)));
  document.querySelectorAll("[data-league-header]").forEach(h => h.addEventListener("click", () => openLeagueDetail(h.dataset.leagueHeader)));
}

      <tr><td>Corners</td><td class="status st-productivo">PRODUCTIVO</td></tr>
      <tr><td>Tarjetas Local / Visita</td><td class="status st-productivo">PRODUCTIVO (certificado)</td></tr>
      <tr><td>Tarjetas Total</td><td class="status st-experimental">EXPERIMENTAL — degradado tras incidente 2026-07-18</td></tr>
      <tr><td>Faltas Local</td><td class="status st-abierta">LÍNEA ABIERTA — sin motor productivo</td></tr>
      <tr><td>Faltas Visita</td><td class="status st-cerrado">CERRADO — sin motor</td></tr>
    </table>
    <div class="footer-note" style="margin-top:8px">Cobertura oficial: 14 de 18 mercados estratégicos productivos. Sin conexión de Content Engine a estas estimaciones todavía (ver módulo Escenarios).</div>`;

  const valor = `
    <div class="odds-input-row">
      <div class="odds-field"><label>Cuota Local</label><input type="text" inputmode="decimal" placeholder="—"></div>
      <div class="odds-field"><label>Cuota Empate</label><input type="text" inputmode="decimal" placeholder="—"></div>
      <div class="odds-field"><label>Cuota Visita</label><input type="text" inputmode="decimal" placeholder="—"></div>
    </div>
    ${pendingBanner("La comparación de valor requiere una probabilidad real de Atlas Pocket (módulo Escenarios, pendiente) — hoy este módulo solo puede recibir la cuota, no calcular valor.")}
    <div class="finding-banner"><b>Hallazgo real (K-0007):</b> el mercado 1X2 ya fue evaluado con cuotas históricas reales — "sin ventaja financiera frente al mercado" bajo las features actuales. No es un dato de este partido puntual, es el estado certificado del modelo en general.</div>`;

  const confianza = `
    <div class="gov-legend">
      <span>CERTIFICADO</span><span>PROMOVIDO</span><span class="active">BASELINE ← 1X2 hoy</span><span>EXPERIMENTAL</span><span>NO_DISPONIBLE</span>
    </div>
    <div class="data-row"><div class="left"><div class="metric">Taxonomía de gobernanza — Atlas Pocket</div><div class="context">Cada estimación declara su propio nivel; ningún mercado se presenta con más autoridad de la que realmente tiene.</div></div><div class="right"></div></div>`;

  const evidencia = isFlagship ? `
    <div class="data-row"><div class="left"><div class="metric">Muestra — tendencia ofensiva ${m.home}</div><div class="context">Ventana reciente, no temporada completa. Confianza media.</div></div><div class="right"><span class="marker-badge progress">◐</span></div></div>
    <div class="data-row"><div class="left"><div class="metric">Muestra — goleador de liga</div><div class="context">Tabla completa de la temporada activa. Confianza alta.</div></div><div class="right"><span class="marker-badge certified">◆</span></div></div>`
    : pendingBanner("Sin evidencia adicional que mostrar para este partido todavía.");

  const simulacion = pendingBanner("No existe un motor de simulación de eventos de partido (goles, tarjetas, córners) en ningún edificio del ecosistema hoy. El único Monte Carlo real existente simula riesgo de ruina de bankroll sobre un historial de apuestas (Laboratorio) — un propósito distinto. Este módulo requeriría desarrollo nuevo desde cero.");

  const estrategias = pendingBanner("Ninguna estrategia certificada por el Laboratorio aplica a este partido hoy.");

  const trackrecord = `
    <div class="data-row"><div class="left"><div class="metric">ROI</div></div><div class="right"><span class="value">—</span></div></div>
    <div class="data-row"><div class="left"><div class="metric">Yield</div></div><div class="right"><span class="value">—</span></div></div>
    <div class="data-row"><div class="left"><div class="metric">CLV</div></div><div class="right"><span class="value">—</span></div></div>
    <div class="data-row"><div class="left"><div class="metric">Brier Score</div></div><div class="right"><span class="value">—</span></div></div>
    <div class="footer-note" style="margin-top:8px">Sin valores porque no existe ninguna estrategia certificada de la que reportar rendimiento — el esquema (ROI/Yield/CLV/Brier) ya existe en el Laboratorio, listo para poblarse el día que exista una.</div>`;

  const recomendacion = `
    <div class="rec-grid">
      <div class="rec-cell">Alta probabilidad, sin valor</div>
      <div class="rec-cell active">Alta confianza + valor → recomendable</div>
      <div class="rec-cell">Valor, baja confianza → no recomendar</div>
      <div class="rec-cell">Sin datos suficientes</div>
    </div>
    <div class="rec-result">Sin recomendación: no hay ninguna estrategia certificada con valor positivo y alta confianza aplicable a este partido hoy.</div>
    <div class="footer-note" style="margin-top:8px">Esta sección solo ilustra dónde encajaría una recomendación en la experiencia — activarla requiere la Enmienda III, todavía no ratificada.</div>`;

  return { tactico, escenarios, mercados, valor, confianza, evidencia, simulacion, estrategias, trackrecord, recomendacion };
}

const SOURCE = {
  tactico: "ce", escenarios: "pocket", mercados: "pocket", valor: "pocket", confianza: "pocket",
  evidencia: "ce", simulacion: "none", estrategias: "lab", trackrecord: "lab", recomendacion: "none",
};
const SOURCE_LABEL = { ce: "Content Engine", pocket: "Atlas Pocket", lab: "Laboratorio", none: "No implementado" };

function openCenter(id) {
  const m = MATCHES.find(x => x.id === id);
  const mods = buildModules(m);
  document.getElementById("c-league").textContent = `${m.league} · ${matchWhen(m)} hora Chile`;
  document.getElementById("c-teams").innerHTML = `${m.home}<span class="vsx">vs</span>${m.away}`;
  document.getElementById("quicknav").innerHTML = MODULES.map(mo => `<button class="qn-pill" data-jump="${mo.id}">${mo.label}</button>`).join("");
  document.getElementById("center-body").innerHTML = MODULES.map(mo => `
    <div class="module" id="mod-${mo.id}">
      <div class="module-head">
        <div class="module-title-group"><span class="module-title">${mo.label}</span></div>
        <span class="source-tag ${SOURCE[mo.id]}">${SOURCE_LABEL[SOURCE[mo.id]]}</span>
      </div>
      ${mods[mo.id]}
    </div>`).join("");
  document.querySelectorAll(".qn-pill").forEach(p => p.addEventListener("click", () => {
    document.getElementById("mod-" + p.dataset.jump).scrollIntoView({ behavior: "smooth", block: "start" });
  }));
  document.getElementById("view-list").hidden = true;
  document.getElementById("view-center").hidden = false;
  window.scrollTo(0, 0);
}
document.getElementById("back-btn").addEventListener("click", () => {
  document.getElementById("view-center").hidden = true;
  document.getElementById("view-list").hidden = false;
});

renderHome();
</script>
