<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ATLAS Lab — Centro de Análisis del Partido (alta fidelidad)</title>
<style>
  :root {
    --ink: #0a0f0c; --surface: #131b16; --surface-2: #1a2420; --border: #223027;
    --text: #edefe9; --text-dim: #9fa9a3; --text-faint: #647069;
    --green: #5b9a63; --green-soft: rgba(91,154,99,0.15);
    --amber: #d9a441; --amber-soft: rgba(217,164,65,0.13);
    --clay: #c97a3d; --clay-soft: rgba(201,122,61,0.13);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Consolas, "Courier New", monospace;
    --serif: Georgia, "Iowan Old Style", "Noto Serif", serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ink: #f2f4ee; --surface: #ffffff; --surface-2: #eaeee4; --border: #d8ddd2;
      --text: #171d19; --text-dim: #4e5951; --text-faint: #838f86;
      --green: #3f7a49; --green-soft: rgba(63,122,73,0.1);
      --amber: #966d1c; --amber-soft: rgba(150,109,28,0.1);
      --clay: #a85d28; --clay-soft: rgba(168,93,40,0.1);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ink); color: var(--text); font-family: var(--sans); line-height: 1.4; -webkit-font-smoothing: antialiased; font-size: 13.5px; }
  a { color: inherit; } button { font: inherit; }
  ::-webkit-scrollbar { display: none; }

  .concept-tag {
    position: fixed; top: 8px; right: 8px; z-index: 80;
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-faint); background: var(--surface); border: 1px solid var(--border);
    padding: 3px 7px; border-radius: 999px;
  }

  /* ---------- home: filas horizontales tipo Netflix (entrada) ---------- */
  #view-list { max-width: 900px; margin: 0 auto; padding: 6px 0 60px; }
  .list-topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 12px; }
  .list-topbar .wordmark { font-family: var(--serif); font-weight: 700; font-size: 17px; }
  .list-topbar .wordmark .dot { color: var(--green); }

  .row-block { margin-bottom: 20px; }
  .row-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 14px 8px; }
  .row-title { font-size: 13.5px; font-weight: 700; }
  .row-count { font-family: var(--mono); font-size: 10px; color: var(--text-faint); }
  .row-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 0 14px; scroll-snap-type: x proximity; }

  .tile {
    flex-shrink: 0; width: 148px; height: 100px; border-radius: 10px; position: relative;
    overflow: hidden; cursor: pointer; padding: 9px 10px; display: flex; flex-direction: column;
    justify-content: space-between; scroll-snap-align: start; border: 1px solid var(--border);
  }
  .tile.status-certified { background: linear-gradient(150deg, color-mix(in srgb, var(--green) 32%, var(--surface)), var(--surface) 75%); }
  .tile.status-progress { background: linear-gradient(150deg, color-mix(in srgb, var(--amber) 32%, var(--surface)), var(--surface) 75%); }
  .tile.status-none { background: var(--surface); }
  .tile.status-correction { background: linear-gradient(150deg, color-mix(in srgb, var(--clay) 32%, var(--surface)), var(--surface) 75%); }
  .tile-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .tile-league { font-family: var(--mono); font-size: 9px; letter-spacing: 0.03em; color: var(--text-faint); text-transform: uppercase; }
  .tile-marker { font-size: 12px; }
  .tile-marker.certified { color: var(--green); } .tile-marker.progress { color: var(--amber); } .tile-marker.correction { color: var(--clay); }
  .tile-title { font-size: 13px; font-weight: 700; line-height: 1.28; color: var(--text); }
  .tile-title .vsx { display: block; font-weight: 400; font-size: 9.5px; color: var(--text-faint); font-family: var(--mono); margin: 1px 0; }
  .tile-foot { font-family: var(--mono); font-size: 9px; color: var(--text-faint); }

  /* ---------- Centro de Analisis ---------- */
  #view-center[hidden] { display: none; }
  .center-topbar {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--ink) 95%, transparent); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .center-topbar .row1 { display: flex; align-items: center; gap: 10px; padding: 9px 14px; max-width: 900px; margin: 0 auto; }
  .back-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 999px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; flex-shrink: 0; }
  .center-topbar .match-id { min-width: 0; }
  .center-topbar .league-line { font-family: var(--mono); font-size: 10px; color: var(--text-faint); }
  .center-topbar .teams-line { font-size: 14.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .center-topbar .teams-line .vsx { color: var(--green); font-family: var(--mono); font-size: 10px; font-weight: 400; margin: 0 5px; }

  .quicknav { display: flex; gap: 4px; overflow-x: auto; padding: 0 14px 8px; max-width: 900px; margin: 0 auto; }
  .qn-pill { flex-shrink: 0; font-family: var(--mono); font-size: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); border-radius: 999px; padding: 4px 9px; cursor: pointer; white-space: nowrap; }
  .qn-pill:hover { border-color: color-mix(in srgb, var(--green) 45%, var(--border)); }

  .center-body { max-width: 900px; margin: 0 auto; padding: 14px 14px 80px; }

  .module { border-top: 1px solid var(--border); padding: 16px 0; scroll-margin-top: 96px; }
  .module:first-child { border-top: none; }
  .module-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .module-title-group { display: flex; align-items: baseline; gap: 8px; }
  .module-title { font-size: 14px; font-weight: 700; }
  .source-tag { font-family: var(--mono); font-size: 9px; letter-spacing: 0.03em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
  .source-tag.ce { color: var(--green); border-color: color-mix(in srgb, var(--green) 50%, var(--border)); background: var(--green-soft); }
  .source-tag.pocket { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 50%, var(--border)); background: var(--amber-soft); }
  .source-tag.lab { color: var(--clay); border-color: color-mix(in srgb, var(--clay) 50%, var(--border)); background: var(--clay-soft); }
  .source-tag.none { color: var(--text-faint); border-color: var(--border); }

  .pending-banner {
    display: flex; gap: 8px; align-items: flex-start; background: var(--surface); border: 1px dashed var(--border);
    border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--text-dim); margin-bottom: 10px;
  }
  .pending-banner .ic { flex-shrink: 0; color: var(--text-faint); }

  .data-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--border); }
  .data-row:last-child { border-bottom: none; }
  .data-row .left { min-width: 0; }
  .data-row .metric { font-size: 12.5px; font-weight: 600; }
  .data-row .context { font-size: 11px; color: var(--text-faint); margin-top: 1px; }
  .data-row .right { flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
  .data-row .value { font-family: var(--mono); font-size: 13px; font-weight: 700; }
  .marker-badge.certified { color: var(--green); } .marker-badge.progress { color: var(--amber); }

  .coverage-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .coverage-table td { padding: 6px 4px; border-bottom: 1px solid var(--border); }
  .coverage-table td.status { text-align: right; font-family: var(--mono); font-size: 10px; white-space: nowrap; }
  .st-productivo { color: var(--green); } .st-experimental { color: var(--amber); } .st-cerrado { color: var(--text-faint); } .st-abierta { color: var(--amber); }

  .odds-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .odds-field { flex: 1; }
  .odds-field label { display: block; font-family: var(--mono); font-size: 9.5px; color: var(--text-faint); margin-bottom: 3px; }
  .odds-field input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 7px 8px; font-family: var(--mono); font-size: 13px;
  }
  .odds-field input:focus { outline: none; border-color: var(--green); }

  .finding-banner {
    background: var(--clay-soft); border: 1px solid color-mix(in srgb, var(--clay) 40%, var(--border));
    border-radius: 8px; padding: 10px 12px; font-size: 12px; margin-top: 8px;
  }
  .finding-banner b { color: var(--clay); }

  .gov-legend { display: flex; gap: 10px; flex-wrap: wrap; font-family: var(--mono); font-size: 10px; color: var(--text-faint); margin-bottom: 10px; }
  .gov-legend .active { color: var(--amber); font-weight: 700; }

  .rec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .rec-cell { border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 11px; color: var(--text-faint); }
  .rec-cell.active { border-color: color-mix(in srgb, var(--green) 55%, var(--border)); background: var(--green-soft); color: var(--green); font-weight: 700; }
  .rec-result {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    font-size: 12.5px; text-align: center; color: var(--text-dim);
  }

  .lab-entry { padding: 8px 4px; border-bottom: 1px solid var(--border); }
  .lab-entry:last-child { border-bottom: none; }
  .lab-entry .h { font-size: 12.5px; font-weight: 600; }
  .lab-entry .d { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }

  .footer-note { margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 10.5px; color: var(--text-faint); text-align: center; }

  /* ---------- story overlay (Cuaderno de Laboratorio / Certificado) ---------- */
  #view-story[hidden] { display: none; }
  .story-body { max-width: 640px; margin: 0 auto; padding: 18px 16px 60px; }
  .story-body .badges { display: flex; gap: 6px; margin-bottom: 12px; }
  .seal { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 10px; color: var(--green); border: 1px solid color-mix(in srgb, var(--green) 55%, var(--border)); background: var(--green-soft); border-radius: 999px; padding: 2px 8px 2px 6px; }
  .correction-tag { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 10px; color: var(--clay); border: 1px solid color-mix(in srgb, var(--clay) 55%, var(--border)); background: var(--clay-soft); border-radius: 999px; padding: 2px 8px; }
  .story-body h1 { font-family: var(--serif); font-size: clamp(20px, 6vw, 25px); line-height: 1.25; margin: 0 0 16px; text-wrap: balance; }
  .story-section { margin-bottom: 16px; }
  .story-section .label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--green); margin-bottom: 5px; }
  .story-section p { font-size: 14.5px; margin: 0; line-height: 1.6; }
  .final-status { background: var(--clay-soft); border: 1px solid color-mix(in srgb, var(--clay) 40%, var(--border)); border-radius: 8px; padding: 11px 13px; font-size: 13px; margin-top: 16px; }
  .final-status .label { color: var(--clay); font-weight: 600; }
</style>
</head>
<body>

<span class="concept-tag">Alta fidelidad · fuentes reales por módulo</span>

<!-- ============ HOME: filas horizontales (entrada) ============ -->
<div id="view-list">
  <div class="list-topbar"><div class="wordmark">ATLAS<span class="dot">·</span>LAB</div></div>
  <div id="rows-container"></div>
</div>

<!-- ============ FICHA DE HISTORIA (Cuaderno/Certificado) ============ -->
<div id="view-story" hidden>
  <div class="center-topbar">
    <div class="row1">
      <button class="back-btn" id="story-back-btn">←</button>
      <span class="wordmark" style="font-size:14px">ATLAS·LAB</span>
    </div>
  </div>
  <div class="story-body" id="story-body"></div>
</div>

<!-- ============ CENTRO DE ANALISIS ============ -->
<div id="view-center" hidden>
  <div class="center-topbar">
    <div class="row1">
      <button class="back-btn" id="back-btn">←</button>
      <div class="match-id">
        <div class="league-line" id="c-league"></div>
        <div class="teams-line" id="c-teams"></div>
      </div>
    </div>
    <div class="quicknav" id="quicknav"></div>
  </div>
  <div class="center-body" id="center-body"></div>
</div>

<script>
/* Datos reales verificados (2026-07-25): coberturas de MOTOR_REGISTRY.md,
   hallazgo K-0007, cierre del programa E00X (Carril B), contrato Estimation
   de Atlas Pocket, y el contenido editorial real ya generado por Content
   Engine. Los modulos que dependen del puente Content Engine <-> Atlas
   Pocket (recien aprobado como arquitectura, no implementado) se muestran
   con su estado real: pendiente de integracion, nunca con un numero
   inventado. */

const MATCHES = [
  { id: "londrina-gremio", home: "Londrina", away: "Grêmio Novorizontino", league: "Brasileirão Série B", date: "26 jul", status: "certified", flagship: true },
  { id: "regatas-vila", home: "Clube De Regatas Brasil", away: "Vila Nova FC", league: "Brasileirão Série B", date: "27 jul", status: "certified" },
  { id: "ponte-athletic", home: "Ponte Preta", away: "Athletic Club", league: "Brasileirão Série B", date: "28 jul", status: "progress" },
  { id: "sport-cuiaba", home: "Sport Recife", away: "Cuiabá", league: "Brasileirão Série B", date: "27 jul", status: "progress" },
  { id: "fla-sao", home: "Flamengo", away: "São Paulo", league: "Brasileirão Betano", date: "26 jul", status: "none" },
  { id: "riv-bar", home: "River Plate", away: "Barracas Central", league: "Liga Profesional de Fútbol", date: "25 jul", status: "none" },
];

const MODULES = [
  { id: "tactico", label: "Análisis táctico" },
  { id: "escenarios", label: "Escenarios" },
  { id: "mercados", label: "Mercados" },
  { id: "valor", label: "Valor" },
  { id: "confianza", label: "Confianza" },
  { id: "evidencia", label: "Evidencia" },
  { id: "simulacion", label: "Simulación" },
  { id: "estrategias", label: "Estrategias" },
  { id: "trackrecord", label: "Track Record" },
  { id: "recomendacion", label: "Recomendación" },
  { id: "laboratorio", label: "Cuaderno" },
];

const STORIES = {
  "jensen-bias": {
    status: "correction", league: "Cuaderno de Laboratorio",
    headline: "El sesgo que fabricaba ventaja donde no la había",
    sections: [
      ["La pregunta", "Dos estrategias del catálogo (E002, E011) mostraban edge positivo sostenido (+6.8pp y +6.3pp) y estaban en seguimiento como candidatas."],
      ["Lo que hicimos", "Se auditó evaluate_combo() — la función que calcula el retorno financiero esperado — y se encontró que promediaba las cuotas como 1/mean(odds) en vez de mean(1/odds): un sesgo de Jensen que sobreestima el edge en mercados con cuotas variables."],
      ["Lo que encontramos", "Al corregir la fórmula, el edge de ambas estrategias se invirtió: E002 pasó de +6.8pp a −1.1pp, E011 de +6.3pp a −2.5pp. Ninguna sobrevivió."],
    ],
    finalStatus: "Ambas estrategias reclasificadas a Refutada el 2026-07-20.",
  },
  "h2h-depth": {
    status: "correction", league: "Cuaderno de Laboratorio",
    headline: "Cuando un historial 'extremo' resultó tener solo 1 o 2 partidos reales detrás",
    sections: [
      ["La pregunta", "Un historial de enfrentamientos directos muy sesgado predice quién gana el próximo cruce."],
      ["Lo que encontramos", "El 69.1% de los casos extremos estaban sustentados en apenas 1 o 2 encuentros reales, no en un historial profundo."],
    ],
    finalStatus: "La lección sobre profundidad de muestra se aplica ahora a todo el catálogo de H2H.",
  },
  "14-refutadas": {
    status: "correction", league: "Cuaderno de Laboratorio",
    headline: "14 hipótesis de apuesta puestas a prueba con rigor — y por qué casi ninguna sobrevivió",
    sections: [
      ["El método", "Cada hipótesis se operacionalizó con un mercado objetivo fijado por lógica futbolística ANTES de ver el resultado."],
      ["Lo que encontramos", "De 14 estrategias investigadas, el resultado final es 12 Refutadas, 2 Archivadas por evidencia insuficiente, 0 Certificadas."],
    ],
    finalStatus: "Programa cerrado definitivamente el 2026-07-20.",
  },
  "k0001": {
    status: "certified", league: "Conocimiento Certificado",
    headline: "FormCalculator supera al baseline naive en 1X2 de las 4 grandes ligas",
    sections: [["Hallazgo certificado", "θ=−1.49pp, p<0.0001, I²=0% — meta-análisis DerSimonian-Laird sobre 4 ligas europeas."]],
    finalStatus: null,
  },
  "k0002": {
    status: "certified", league: "Conocimiento Certificado",
    headline: "ELO es el grupo de señal dominante sobre la representación actual de features",
    sections: [["Hallazgo certificado", "Shapley 79.9% para ELO, 20.4% para Forma — H2H y Goles son prescindibles en la representación actual."]],
    finalStatus: null,
  },
};

const ROWS = [
  { title: "Con análisis nuevo", ids: ["londrina-gremio", "regatas-vila", "ponte-athletic", "sport-cuiaba"] },
  { title: "Cuaderno de Laboratorio", ids: ["jensen-bias", "h2h-depth", "14-refutadas"] },
  { title: "Brasileirão Série B — hoy y mañana", ids: ["londrina-gremio", "regatas-vila", "ponte-athletic", "sport-cuiaba"] },
  { title: "Otras ligas — hoy y mañana", ids: ["fla-sao", "riv-bar"] },
  { title: "Conocimiento Certificado", ids: ["k0001", "k0002"] },
];

function getTileItem(id) {
  const m = MATCHES.find(x => x.id === id);
  if (m) return { kind: "match", ...m };
  return { kind: "story", id, ...STORIES[id] };
}

function tileHtml(id) {
  const it = getTileItem(id);
  const statusClass = "status-" + it.status;
  const markerMap = { certified: "◆", progress: "◐", correction: "↺", none: "" };
  const marker = markerMap[it.status] || "";
  if (it.kind === "match") {
    return `
    <div class="tile ${statusClass}" data-id="${id}">
      <div class="tile-top"><span class="tile-league">${it.league}</span>${marker ? `<span class="tile-marker ${it.status}">${marker}</span>` : ""}</div>
      <div class="tile-title">${it.home}<span class="vsx">vs</span>${it.away}</div>
      <div class="tile-foot">${it.date}</div>
    </div>`;
  }
  return `
  <div class="tile ${statusClass}" data-id="${id}">
    <div class="tile-top"><span class="tile-league">${it.league}</span>${marker ? `<span class="tile-marker ${it.status}">${marker}</span>` : ""}</div>
    <div class="tile-title">${it.headline}</div>
    <div class="tile-foot"></div>
  </div>`;
}

function renderRows() {
  document.getElementById("rows-container").innerHTML = ROWS.map(row => `
    <div class="row-block">
      <div class="row-head"><span class="row-title">${row.title}</span><span class="row-count">${row.ids.length}</span></div>
      <div class="row-scroll">${row.ids.map(tileHtml).join("")}</div>
    </div>`).join("");
  document.querySelectorAll(".tile").forEach(t => t.addEventListener("click", () => {
    const id = t.dataset.id;
    if (MATCHES.find(m => m.id === id)) openCenter(id); else openStory(id);
  }));
}

function pendingBanner(text) {
  return `<div class="pending-banner"><span class="ic">⧗</span><span>${text}</span></div>`;
}

/* ---- Construye cada modulo segun si el partido es el flagship (con contenido real completo) o no ---- */
function buildModules(m) {
  const isFlagship = !!m.flagship;

  const tactico = isFlagship ? `
    <div class="data-row"><div class="left"><div class="metric">Tendencia ofensiva — ${m.home}</div><div class="context">Por encima de su propio promedio de temporada en los últimos partidos.</div></div><div class="right"><span class="value">2.0 gpp</span><span class="marker-badge progress">◐</span></div></div>
    <div class="data-row"><div class="left"><div class="metric">Goleador de la liga — ${m.away}</div><div class="context">Máximo anotador de ${m.league} en la temporada activa.</div></div><div class="right"><span class="value">28 goles</span><span class="marker-badge certified">◆</span></div></div>
    <div class="data-row"><div class="left"><div class="metric">Radiografía de la liga</div><div class="context">Promedio de goles por partido de ${m.league} en la temporada activa.</div></div><div class="right"><span class="value">2.27 gpp</span><span class="marker-badge certified">◆</span></div></div>`
    : `${pendingBanner("Sin patrones automáticos detectados para este partido todavía.")}`;

  const escenarios = `
    ${pendingBanner("Este módulo consume Atlas Pocket. El puente Content Engine ↔ Atlas Pocket fue aprobado como arquitectura el 2026-07-25, pero no está implementado — no hay una estimación real que mostrar todavía, y no se inventa una.")}
    <div class="data-row"><div class="left"><div class="metric">Motor disponible para 1X2</div><div class="context">FormCalculator — Estado: PRODUCTIVO en Atlas Pocket. Gobernanza: BASELINE (nunca promovido ni certificado).</div></div><div class="right"></div></div>`;

  const mercados = `
    <div class="gov-legend"><span>Cobertura real verificada — MOTOR_REGISTRY.md, 2026-07-18</span></div>
    <table class="coverage-table">
      <tr><td>1X2 Tiempo Completo</td><td class="status st-productivo">PRODUCTIVO (BASELINE)</td></tr>
      <tr><td>Over/Under Goles</td><td class="status st-productivo">PRODUCTIVO</td></tr>
      <tr><td>BTTS</td><td class="status st-cerrado">CERRADO — 5 arquitecturas sin señal</td></tr>
      <tr><td>Corners</td><td class="status st-productivo">PRODUCTIVO</td></tr>
      <tr><td>Tarjetas Local / Visita</td><td class="status st-productivo">PRODUCTIVO (certificado)</td></tr>
      <tr><td>Tarjetas Total</td><td class="status st-experimental">EXPERIMENTAL — degradado tras incidente 2026-07-18</td></tr>
      <tr><td>Faltas Local</td><td class="status st-abierta">LÍNEA ABIERTA — sin motor productivo</td></tr>
      <tr><td>Faltas Visita</td><td class="status st-cerrado">CERRADO — sin motor</td></tr>
    </table>
    <div class="footer-note" style="margin-top:8px">Cobertura oficial: 14 de 18 mercados estratégicos productivos. Sin conexión de Content Engine a estas estimaciones todavía (ver módulo Escenarios).</div>`;

  const valor = `
    <div class="odds-input-row">
      <div class="odds-field"><label>Cuota Local</label><input type="text" inputmode="decimal" placeholder="—"></div>
      <div class="odds-field"><label>Cuota Empate</label><input type="text" inputmode="decimal" placeholder="—"></div>
      <div class="odds-field"><label>Cuota Visita</label><input type="text" inputmode="decimal" placeholder="—"></div>
    </div>
    ${pendingBanner("La comparación de valor requiere una probabilidad real de Atlas Pocket (módulo Escenarios, pendiente) — hoy este módulo solo puede recibir la cuota, no calcular valor.")}
    <div class="finding-banner"><b>Hallazgo real (K-0007):</b> el mercado 1X2 ya fue evaluado con cuotas históricas reales — "sin ventaja financiera frente al mercado" bajo las features actuales. No es un dato de este partido puntual, es el estado certificado del modelo en general.</div>`;

  const confianza = `
    <div class="gov-legend">
      <span>CERTIFICADO</span><span>PROMOVIDO</span><span class="active">BASELINE ← 1X2 hoy</span><span>EXPERIMENTAL</span><span>NO_DISPONIBLE</span>
    </div>
    <div class="data-row"><div class="left"><div class="metric">Taxonomía de gobernanza — Atlas Pocket</div><div class="context">Cada estimación declara su propio nivel; ningún mercado se presenta con más autoridad de la que realmente tiene.</div></div><div class="right"></div></div>`;

  const evidencia = isFlagship ? `
    <div class="data-row"><div class="left"><div class="metric">Muestra — tendencia ofensiva ${m.home}</div><div class="context">Ventana reciente, no temporada completa. Confianza media.</div></div><div class="right"><span class="marker-badge progress">◐</span></div></div>
    <div class="data-row"><div class="left"><div class="metric">Muestra — goleador de liga</div><div class="context">Tabla completa de la temporada activa. Confianza alta.</div></div><div class="right"><span class="marker-badge certified">◆</span></div></div>`
    : pendingBanner("Sin evidencia adicional que mostrar para este partido todavía.");

  const simulacion = pendingBanner("No existe un motor de simulación de eventos de partido (goles, tarjetas, córners) en ningún edificio del ecosistema hoy. El único Monte Carlo real existente simula riesgo de ruina de bankroll sobre un historial de apuestas (Laboratorio) — un propósito distinto. Este módulo requeriría desarrollo nuevo desde cero.");

  const estrategias = `
    ${pendingBanner("Ninguna estrategia certificada por el Laboratorio aplica a este partido hoy.")}
    <div class="data-row"><div class="left"><div class="metric">Programa E00X — Carril B</div><div class="context">14 hipótesis evaluadas con disciplina pre-registrada, cerrado el 2026-07-20.</div></div><div class="right"><span class="value">0/14</span></div></div>`;

  const trackrecord = `
    <div class="data-row"><div class="left"><div class="metric">ROI</div></div><div class="right"><span class="value">—</span></div></div>
    <div class="data-row"><div class="left"><div class="metric">Yield</div></div><div class="right"><span class="value">—</span></div></div>
    <div class="data-row"><div class="left"><div class="metric">CLV</div></div><div class="right"><span class="value">—</span></div></div>
    <div class="data-row"><div class="left"><div class="metric">Brier Score</div></div><div class="right"><span class="value">—</span></div></div>
    <div class="footer-note" style="margin-top:8px">Sin valores porque no existe ninguna estrategia certificada de la que reportar rendimiento — el esquema (ROI/Yield/CLV/Brier) ya existe en el Laboratorio, listo para poblarse el día que exista una.</div>`;

  const recomendacion = `
    <div class="rec-grid">
      <div class="rec-cell">Alta probabilidad, sin valor</div>
      <div class="rec-cell active">Alta confianza + valor → recomendable</div>
      <div class="rec-cell">Valor, baja confianza → no recomendar</div>
      <div class="rec-cell">Sin datos suficientes</div>
    </div>
    <div class="rec-result">Sin recomendación: no hay ninguna estrategia certificada con valor positivo y alta confianza aplicable a este partido hoy.</div>
    <div class="footer-note" style="margin-top:8px">Esta sección solo ilustra dónde encajaría una recomendación en la experiencia — activarla requiere la Enmienda III, todavía no ratificada.</div>`;

  const laboratorio = `
    <div class="lab-entry"><div class="h">El sesgo que fabricaba ventaja donde no la había</div><div class="d">Cuaderno de Laboratorio · corrección pública, 2026-07-20</div></div>
    <div class="lab-entry"><div class="h">Historial 'extremo' con solo 1-2 partidos reales detrás</div><div class="d">Cuaderno de Laboratorio · corrección pública</div></div>`;

  return { tactico, escenarios, mercados, valor, confianza, evidencia, simulacion, estrategias, trackrecord, recomendacion, laboratorio };
}

const SOURCE = {
  tactico: "ce", escenarios: "pocket", mercados: "pocket", valor: "pocket", confianza: "pocket",
  evidencia: "ce", simulacion: "none", estrategias: "lab", trackrecord: "lab", recomendacion: "none", laboratorio: "lab",
};
const SOURCE_LABEL = { ce: "Content Engine", pocket: "Atlas Pocket", lab: "Laboratorio", none: "No implementado" };

function openCenter(id) {
  const m = MATCHES.find(x => x.id === id);
  const mods = buildModules(m);
  document.getElementById("c-league").textContent = `${m.league} · ${m.date}`;
  document.getElementById("c-teams").innerHTML = `${m.home}<span class="vsx">vs</span>${m.away}`;
  document.getElementById("quicknav").innerHTML = MODULES.map(mo => `<button class="qn-pill" data-jump="${mo.id}">${mo.label}</button>`).join("");
  document.getElementById("center-body").innerHTML = MODULES.map(mo => `
    <div class="module" id="mod-${mo.id}">
      <div class="module-head">
        <div class="module-title-group"><span class="module-title">${mo.label}</span></div>
        <span class="source-tag ${SOURCE[mo.id]}">${SOURCE_LABEL[SOURCE[mo.id]]}</span>
      </div>
      ${mods[mo.id]}
    </div>`).join("");
  document.querySelectorAll(".qn-pill").forEach(p => p.addEventListener("click", () => {
    document.getElementById("mod-" + p.dataset.jump).scrollIntoView({ behavior: "smooth", block: "start" });
  }));
  document.getElementById("view-list").hidden = true;
  document.getElementById("view-center").hidden = false;
  window.scrollTo(0, 0);
}
document.getElementById("back-btn").addEventListener("click", () => {
  document.getElementById("view-center").hidden = true;
  document.getElementById("view-list").hidden = false;
});

function openStory(id) {
  const s = STORIES[id];
  const badges = `${s.status === "certified" ? '<span class="seal">◆ Certificado</span>' : ""}${s.status === "correction" ? '<span class="correction-tag">↺ Corrección pública</span>' : ""}`;
  const sections = s.sections.map(([label, text]) => `<div class="story-section"><div class="label">${label}</div><p>${text}</p></div>`).join("");
  const finalStatus = s.finalStatus ? `<div class="final-status"><span class="label">Estado final — </span>${s.finalStatus}</div>` : "";
  document.getElementById("story-body").innerHTML = `<div class="badges">${badges}</div><h1>${s.headline}</h1>${sections}${finalStatus}`;
  document.getElementById("view-list").hidden = true;
  document.getElementById("view-story").hidden = false;
  window.scrollTo(0, 0);
}
document.getElementById("story-back-btn").addEventListener("click", () => {
  document.getElementById("view-story").hidden = true;
  document.getElementById("view-list").hidden = false;
});

renderRows();
</script>
</body>
